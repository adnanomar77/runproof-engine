name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Run lint
        run: ruff check src tests
      - name: Compile sources
        run: python -m compileall -q src tests

  package:
    name: Build and validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*

  quality:
    name: Fuzz, security, and performance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run property-based fuzz tests
        run: python -m pytest -q tests/test_fuzz.py
      - name: Run security scan
        run: bandit -r src -ll
      - name: Audit project dependencies
        run: pip freeze | grep -vi 'runproof-engine' > /tmp/runproof-audit-requirements.txt && pip-audit --strict -r /tmp/runproof-audit-requirements.txt
      - name: Run performance benchmark
        run: python benchmarks/benchmark_capture.py
