[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "runproof-engine"
version = "0.2.0"
description = "Evidence, replay, and explainable diffs for real Python runs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "RunProof Contributors" }
]
keywords = ["reproducibility", "provenance", "data-lineage", "observability", "python", "replay", "explainable-diff"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.0", "polars>=1.0"]
http = ["requests>=2.31", "httpx>=0.27"]
database = ["SQLAlchemy>=2.0", "psycopg[binary]>=3.1"]
jupyter = ["nbclient>=0.10", "nbformat>=5.9"]
cloud = ["boto3>=1.34"]
ml = ["joblib>=1.3"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "twine>=5", "hypothesis>=6.100", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
runproof = "runproof_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runproof_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
